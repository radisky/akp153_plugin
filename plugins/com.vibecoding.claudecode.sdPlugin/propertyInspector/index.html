<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code 바이브코딩 설정</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --card: #272726;
      --border: #3a3a38;
      --accent: #d97757;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --ok: #10b981;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 14px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .field {
      margin-bottom: 9px;
    }
    .field:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    select, input[type="text"], textarea {
      width: 100%;
      background: #181817;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      min-height: 56px;
      resize: vertical;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      margin-top: 6px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    button {
      background: #191918;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button:hover {
      border-color: var(--accent);
      background: #302622;
    }
    button.primary {
      background: #d97757;
      color: #fff;
      border-color: #d97757;
      width: 100%;
      margin-top: 7px;
      padding: 7px 10px;
    }
    button.primary:hover {
      background: #e38667;
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
      background: #143328;
      color: var(--ok);
    }
    .badge.warn {
      background: #38260a;
      color: var(--warn);
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 0. Universal Icon Display Mode -->
  <div class="section">
    <div class="section-title">LCD 아이콘 표시 스타일</div>
    <div class="field">
      <select id="displayStyle">
        <option value="icon_label">대형 벡터 아이콘 + 굵은 라벨 (기본 추천)</option>
        <option value="icon_only">순수 대형 아이콘만 표시 (무각인 미니멀)</option>
      </select>
    </div>
  </div>

  <!-- 1. Action-Specific Settings -->
  <div class="section hidden" id="cfg-status">
    <div class="section-title">에이전트 구동 상태 표시 설정</div>
    <div class="field">
      <label for="panelMode">표시 패널 종류</label>
      <select id="panelMode">
        <option value="overview">메인 구동 상태 (대기 / 동작중 / 승인·입력대기 / 완료)</option>
        <option value="activity">상세 진행 도구 &amp; 대기 항목 모니터</option>
        <option value="metrics">세션 요약 (현재 모델 · 모드 · 추론강도 · Thinking)</option>
      </select>
    </div>
    <div class="field">
      <label for="customLabel">대기 상태 보조 문구 (비워두면 기본값)</label>
      <input type="text" id="customLabel" placeholder="클릭: 터미널 포커스" />
    </div>
    <div class="hint">• 짧게 누름: Claude 터미널 창으로 즉시 포커스<br>• 길게 누름(0.6초): 하드웨어에서 5가지 상태 미리보기 순환</div>
  </div>

  <div class="section hidden" id="cfg-approval">
    <div class="section-title">입력 대기 응답 키 설정</div>
    <div class="field">
      <label for="responseType">응답 동작</label>
      <select id="responseType">
        <option value="approve">승인 / 확인 (Enter, 길게: y + Enter)</option>
        <option value="approve_session">이번 세션 계속 허용 (숫자 2 전송)</option>
        <option value="reject">거절 / 즉시 중단 (Esc, 길게: Ctrl+C)</option>
      </select>
    </div>
    <label class="check-row">
      <input type="checkbox" id="autoFocusTerminal" checked />
      전송 전 Claude 터미널 자동 포커스
    </label>
  </div>

  <div class="section hidden" id="cfg-model">
    <div class="section-title">Claude 모델 변경 설정</div>
    <div class="field">
      <label for="modelMode">전환 방식</label>
      <select id="modelMode">
        <option value="cycle">순환 변경 (Sonnet 5.5 → Opus 5.5 → Fable 5.1 → Haiku 5.5 → OpusPlan)</option>
        <option value="fixed">특정 모델로 즉시 지정</option>
      </select>
    </div>
    <div class="field" id="targetModelWrap">
      <label for="targetModel">지정 모델 (최신 Claude 5 세대)</label>
      <select id="targetModel">
        <option value="sonnet">Claude Sonnet 5.5 (claude-sonnet-5-5 · 데일리 밸런스)</option>
        <option value="opus">Claude Opus 5.5 (claude-opus-5-5 · 플래그십 복합설계)</option>
        <option value="fable">Claude Fable 5.1 (claude-fable-5-1 · 최상위 심층 추론)</option>
        <option value="haiku">Claude Haiku 5.5 (claude-haiku-5-5 · 초고속 경량)</option>
        <option value="opusplan">Opus Plan 하이브리드 (opusplan · 설계Opus + 구현Sonnet)</option>
      </select>
    </div>
    <label class="check-row">
      <input type="checkbox" id="modelSendSlash" checked />
      settings.json 저장과 함께 활성 창에 <code>/model</code> 전송
    </label>
  </div>

  <div class="section hidden" id="cfg-mode">
    <div class="section-title">바이브코딩 모드 &amp; 추론 설정</div>
    <div class="field">
      <label for="settingType">제어할 설정 항목</label>
      <select id="settingType">
        <option value="perm_mode">권한/플랜 모드 순환 (Shift+Tab: 일반/자동수정/플랜)</option>
        <option value="effort">추론 강도 순환 (Effort: Low / Medium / High / Max)</option>
        <option value="thinking">확장 사고 토글 (Win: Alt+T / Mac: Option+T)</option>
      </select>
    </div>
    <label class="check-row">
      <input type="checkbox" id="modeSendSlash" />
      추론 강도 변경 시 <code>/effort</code> 슬래시 명령도 함께 전송
    </label>
  </div>

  <div class="section hidden" id="cfg-command">
    <div class="section-title">슬래시 명령어 &amp; 바이브 프롬프트</div>
    <div class="field">
      <label for="preset">추천 프리셋</label>
      <select id="preset">
        <option value="compact">/compact (컨텍스트 압축 · 길게: /context)</option>
        <option value="clear">/clear (세션 초기화 · 길게: /doctor)</option>
        <option value="cost">/cost (비용 확인 · 길게: /resume 이전 세션)</option>
        <option value="vibe_fix">바이브 프롬프트: 빌드 &amp; 테스트 오류 자동 수정</option>
        <option value="vibe_commit">바이브 프롬프트: 변경사항 요약 &amp; Git 커밋</option>
        <option value="custom">직접 입력 (커스텀 명령어 / 프롬프트)</option>
      </select>
    </div>
    <div class="field">
      <label for="label">키 메인 라벨</label>
      <input type="text" id="label" placeholder="/compact" />
    </div>
    <div class="field">
      <label for="subLabel">키 보조 설명</label>
      <input type="text" id="subLabel" placeholder="컨텍스트 압축" />
    </div>
    <div class="field">
      <label for="commandText">짧게 누를 때 전송할 텍스트</label>
      <textarea id="commandText" placeholder="/compact"></textarea>
    </div>
    <div class="field">
      <label for="longPressCommand">길게 누를 때 전송할 텍스트 (선택)</label>
      <input type="text" id="longPressCommand" placeholder="/resume" />
    </div>
    <label class="check-row">
      <input type="checkbox" id="autoEnter" checked />
      텍스트 입력 후 자동으로 Enter 실행
    </label>
  </div>

  <div class="section hidden" id="cfg-utility">
    <div class="section-title">바이브코딩 유틸리티</div>
    <div class="field">
      <label for="utilType">기능 선택</label>
      <select id="utilType">
        <option value="voice">음성 바이브코딩 받아쓰기 (Win+H / macOS 받아쓰기)</option>
        <option value="screenshot">스크린샷 이미지 첨부 (Win: Alt+V / Mac: Ctrl+V, 길게: 영역캡처)</option>
        <option value="launch">Claude 터미널 포커스 (길게: 새 터미널에서 Claude 실행)</option>
        <option value="install_hooks">상태 훅 자동설치 및 LCD 데모 실행</option>
      </select>
    </div>
  </div>

  <!-- 2. Live LCD State Simulator & Hook Status -->
  <div class="section">
    <div class="section-title">
      <span>실시간 구동 상태 테스트 (LCD 즉시 반영)</span>
      <span id="hookBadge" class="badge">훅 연동 확인중</span>
    </div>
    <div class="btn-grid">
      <button type="button" data-sim="IDLE">✻ 대기중</button>
      <button type="button" data-sim="RUNNING">◐ 동작중</button>
      <button type="button" data-sim="WAITING_PERMISSION">⚠ 승인대기</button>
      <button type="button" data-sim="WAITING_INPUT">? 입력대기</button>
      <button type="button" data-sim="COMPLETED">✓ 작업완료</button>
      <button type="button" id="btnDemo">▶ 연속데모</button>
    </div>
    <button type="button" class="primary" id="btnInstallHooks">
      ~/.claude/settings.json 실시간 상태 훅 자동 설정/복구
    </button>
    <div class="hint" id="liveSummary">연결 대기 중...</div>
  </div>

  <script>
    let ws = null;
    let piUUID = '';
    let actionUUID = '';
    let actionContext = '';
    let currentSettings = {};

    const PRESET_DEFAULTS = {
      compact:     { label: '/compact', subLabel: '컨텍스트 압축', commandText: '/compact', longPressCommand: '/context' },
      clear:       { label: '/clear',   subLabel: '새 세션 초기화', commandText: '/clear',   longPressCommand: '/doctor' },
      cost:        { label: '/cost',    subLabel: '토큰 · 비용 확인', commandText: '/cost',    longPressCommand: '/resume' },
      vibe_fix:    { label: '빌드 & 수정', subLabel: '테스트 오류 해결', commandText: '빌드와 테스트를 실행하고 에러나 실패한 항목이 있으면 원인을 찾아 수정해줘', longPressCommand: '' },
      vibe_commit: { label: '요약 & 커밋', subLabel: 'Git 변경사항 커밋', commandText: 'git status와 diff를 확인해서 변경사항을 깔끔하게 요약하고 적절한 커밋 메시지로 커밋해줘', longPressCommand: '/diff' }
    };

    function showRelevantSection() {
      const map = {
        'com.vibecoding.claudecode.status':   'cfg-status',
        'com.vibecoding.claudecode.approval': 'cfg-approval',
        'com.vibecoding.claudecode.model':    'cfg-model',
        'com.vibecoding.claudecode.mode':     'cfg-mode',
        'com.vibecoding.claudecode.command':  'cfg-command',
        'com.vibecoding.claudecode.utility':  'cfg-utility'
      };
      Object.values(map).forEach((id) => document.getElementById(id).classList.add('hidden'));
      const target = map[actionUUID];
      if (target) document.getElementById(target).classList.remove('hidden');
    }

    function populateFields(s) {
      document.getElementById('displayStyle').value = s.displayStyle || 'icon_label';
      if (s.panelMode) document.getElementById('panelMode').value = s.panelMode;
      document.getElementById('customLabel').value = s.customLabel || '';

      if (s.responseType) document.getElementById('responseType').value = s.responseType;
      document.getElementById('autoFocusTerminal').checked = s.autoFocusTerminal !== false;

      if (s.modelMode) document.getElementById('modelMode').value = s.modelMode;
      if (s.targetModel) document.getElementById('targetModel').value = s.targetModel;
      document.getElementById('modelSendSlash').checked = s.sendSlashCommand !== false;
      document.getElementById('targetModelWrap').style.display =
        document.getElementById('modelMode').value === 'fixed' ? 'block' : 'none';

      if (s.settingType) document.getElementById('settingType').value = s.settingType;
      document.getElementById('modeSendSlash').checked = s.sendSlashCommand === true;

      if (s.preset) document.getElementById('preset').value = s.preset;
      document.getElementById('label').value = s.label || '';
      document.getElementById('subLabel').value = s.subLabel || '';
      document.getElementById('commandText').value = s.commandText || '';
      document.getElementById('longPressCommand').value = s.longPressCommand || '';
      document.getElementById('autoEnter').checked = s.autoEnter !== false;

      if (s.utilType) document.getElementById('utilType').value = s.utilType;
    }

    function saveSettings() {
      let next = { ...currentSettings };
      next.displayStyle = document.getElementById('displayStyle').value;
      if (actionUUID === 'com.vibecoding.claudecode.status') {
        next.panelMode = document.getElementById('panelMode').value;
        next.customLabel = document.getElementById('customLabel').value;
      } else if (actionUUID === 'com.vibecoding.claudecode.approval') {
        next.responseType = document.getElementById('responseType').value;
        next.autoFocusTerminal = document.getElementById('autoFocusTerminal').checked;
      } else if (actionUUID === 'com.vibecoding.claudecode.model') {
        next.modelMode = document.getElementById('modelMode').value;
        next.targetModel = document.getElementById('targetModel').value;
        next.sendSlashCommand = document.getElementById('modelSendSlash').checked;
        document.getElementById('targetModelWrap').style.display =
          next.modelMode === 'fixed' ? 'block' : 'none';
      } else if (actionUUID === 'com.vibecoding.claudecode.mode') {
        next.settingType = document.getElementById('settingType').value;
        next.sendSlashCommand = document.getElementById('modeSendSlash').checked;
      } else if (actionUUID === 'com.vibecoding.claudecode.command') {
        next.preset = document.getElementById('preset').value;
        next.label = document.getElementById('label').value;
        next.subLabel = document.getElementById('subLabel').value;
        next.commandText = document.getElementById('commandText').value;
        next.longPressCommand = document.getElementById('longPressCommand').value;
        next.autoEnter = document.getElementById('autoEnter').checked;
      } else if (actionUUID === 'com.vibecoding.claudecode.utility') {
        next.utilType = document.getElementById('utilType').value;
      }

      currentSettings = next;
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          event: 'setSettings',
          context: piUUID,
          payload: currentSettings
        }));
      }
    }

    function sendToPlugin(payload) {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          event: 'sendToPlugin',
          action: actionUUID,
          context: piUUID,
          payload
        }));
      }
      // Also support direct localhost fallback
      if (payload.cmd === 'simulate' || payload.cmd === 'demo') {
        fetch('http://127.0.0.1:17530/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload.cmd === 'demo' ? { demo: true } : { state: payload.state })
        }).catch(() => {});
      }
    }

    function updateStateUI(st) {
      if (!st) return;
      const badge = document.getElementById('hookBadge');
      if (st.hooksInstalled) {
        badge.textContent = '✓ Claude 훅 연결됨';
        badge.className = 'badge';
      } else {
        badge.textContent = '⚠ 훅 미설정';
        badge.className = 'badge warn';
      }
      document.getElementById('liveSummary').textContent =
        `현재 상태: ${st.state} | 모델: ${st.modelDisplay || st.model.toUpperCase()} (${st.modelId || ''}) | 강도: ${st.effortLevel.toUpperCase()} | 활성 타일: ${st.connectedContexts}개`;
    }

    document.getElementById('preset').addEventListener('change', (e) => {
      const p = PRESET_DEFAULTS[e.target.value];
      if (p) {
        document.getElementById('label').value = p.label;
        document.getElementById('subLabel').value = p.subLabel;
        document.getElementById('commandText').value = p.commandText;
        document.getElementById('longPressCommand').value = p.longPressCommand;
      }
      saveSettings();
    });

    document.querySelectorAll('select, input, textarea').forEach((el) => {
      if (el.id === 'preset') return;
      el.addEventListener('change', saveSettings);
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.addEventListener('input', saveSettings);
      }
    });

    document.querySelectorAll('[data-sim]').forEach((btn) => {
      btn.addEventListener('click', () => {
        sendToPlugin({ cmd: 'simulate', state: btn.getAttribute('data-sim') });
      });
    });

    document.getElementById('btnDemo').addEventListener('click', () => {
      sendToPlugin({ cmd: 'demo' });
    });

    document.getElementById('btnInstallHooks').addEventListener('click', () => {
      sendToPlugin({ cmd: 'installHooks' });
    });

    window.connectElgatoStreamDeckSocket = function (
      inPort,
      inPropertyInspectorUUID,
      inRegisterEvent,
      inInfo,
      inActionInfo
    ) {
      piUUID = inPropertyInspectorUUID;
      const act = JSON.parse(inActionInfo);
      actionUUID = act.action;
      actionContext = act.context;
      currentSettings = (act.payload && act.payload.settings) || {};

      showRelevantSection();
      populateFields(currentSettings);

      ws = new WebSocket('ws://127.0.0.1:' + inPort);
      ws.onopen = function () {
        ws.send(JSON.stringify({
          event: inRegisterEvent,
          uuid: inPropertyInspectorUUID
        }));
        sendToPlugin({ cmd: 'getState' });
      };
      ws.onmessage = function (evt) {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.event === 'didReceiveSettings' && msg.payload && msg.payload.settings) {
            currentSettings = msg.payload.settings;
            populateFields(currentSettings);
          } else if (msg.event === 'sendToPropertyInspector' && msg.payload) {
            if (msg.payload.type === 'stateUpdate') {
              updateStateUI(msg.payload.state);
            }
          }
        } catch (_) {}
      };
    };
    window.connectSocket = window.connectElgatoStreamDeckSocket;
  </script>
</body>
</html>
