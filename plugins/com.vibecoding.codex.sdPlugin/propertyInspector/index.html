<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OpenAI Codex 바이브코딩 설정</title>
  <style>
    :root {
      --bg: #1e1e1e; --card: #272726; --border: #3a3a38;
      --accent: #10b981; --text: #f1f5f9; --muted: #94a3b8;
      --ok: #34d399; --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px 14px 20px; background: var(--bg); color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px; line-height: 1.5;
    }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; margin-bottom: 10px; }
    .section-title { font-size: 12px; font-weight: 700; color: #34d399; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .field { margin-bottom: 9px; }
    label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    select, input[type="text"], textarea {
      width: 100%; background: #181817; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 12px; outline: none;
    }
    textarea { min-height: 54px; resize: vertical; }
    .check-row { display: flex; align-items: center; gap: 7px; cursor: pointer; margin-top: 6px; font-size: 12px; }
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    button {
      background: #191918; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    button:hover { border-color: var(--accent); background: #122b23; }
    button.primary { background: var(--accent); color: #052e16; border-color: var(--accent); width: 100%; margin-top: 7px; padding: 7px 10px; font-weight: 800; }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 700; background: #143328; color: var(--ok); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="section">
    <div class="section-title">LCD 아이콘 표시 스타일</div>
    <select id="displayStyle">
      <option value="icon_label">대형 벡터 아이콘 + 굵은 라벨 (기본 추천)</option>
      <option value="icon_only">순수 대형 아이콘만 표시 (무각인 미니멀)</option>
    </select>
  </div>

  <div class="section hidden" id="cfg-status">
    <div class="section-title">OpenAI Codex 구동 상태 설정</div>
    <div class="field">
      <label>패널 모드</label>
      <select id="panelMode">
        <option value="overview">메인 구동 상태 (대기 / 동작중 / 승인·입력대기 / 완료)</option>
        <option value="activity">실시간 실행 도구 모니터 (셸실행 / 패치적용 / 코드리뷰)</option>
        <option value="metrics">세션 요약 (현재 GPT-6 모델 · 추론 강도 · 샌드박스)</option>
      </select>
    </div>
    <div class="hint">• ~/.codex/hooks.json, notify, sessions/*.jsonl 삼중 실시간 감지</div>
  </div>

  <div class="section hidden" id="cfg-approval">
    <div class="section-title">응답 / 제어 키 설정</div>
    <select id="responseType">
      <option value="approve">승인 / 확인 (Enter, 길게: y 전송)</option>
      <option value="approve_session">세션 항상 허용 (a 전송, 길게: /permissions)</option>
      <option value="reject">즉시 중단 / 거절 (Esc, 길게: Ctrl+C)</option>
    </select>
  </div>

  <div class="section hidden" id="cfg-model">
    <div class="section-title">최신 OpenAI GPT-6 모델 전환</div>
    <div class="field">
      <label>전환 방식</label>
      <select id="modelMode">
        <option value="cycle">순환 (GPT-6.1 Sol → GPT-6 Astra → GPT-6.1 Terra → GPT-6 Luna)</option>
        <option value="fixed">특정 모델 고정</option>
      </select>
    </div>
    <div class="field" id="targetModelWrap">
      <label>지정 모델</label>
      <select id="targetModel">
        <option value="sol">GPT-6.1 Sol (gpt-6.1-sol · 플래그십 코딩 기본)</option>
        <option value="astra">GPT-6 Astra (gpt-6-astra · 심층 프론티어 추론)</option>
        <option value="terra">GPT-6.1 Terra (gpt-6.1-terra · 고속 밸런스 코딩)</option>
        <option value="luna">GPT-6 Luna (gpt-6-luna · 초경량 초고속 반복)</option>
      </select>
    </div>
    <label class="check-row">
      <input type="checkbox" id="modelSendSlash" checked />
      활성 Codex 창에 <code>/model</code> 명령도 함께 전송
    </label>
  </div>

  <div class="section hidden" id="cfg-mode">
    <div class="section-title">승인 정책 · 추론 강도 · 샌드박스</div>
    <select id="settingType">
      <option value="perm_mode">승인 정책 순환 (요청승인 ↔ 자동수정 ↔ 완전자율)</option>
      <option value="effort">추론 강도 순환 (Low → Med → High → XHigh)</option>
      <option value="sandbox">샌드박스 순환 (쓰기허용 RW ↔ 읽기전용 RO ↔ 풀액세스)</option>
    </select>
  </div>

  <div class="section hidden" id="cfg-command">
    <div class="section-title">Codex 슬래시 명령어 &amp; 프롬프트</div>
    <div class="field">
      <label>추천 프리셋</label>
      <select id="preset">
        <option value="review">/review 자동 코드리뷰 (길게: /diff)</option>
        <option value="compact">/compact 컨텍스트 압축 (길게: /status)</option>
        <option value="clear">/new 새 세션 전환 (길게: /init AGENTS.md 생성)</option>
        <option value="ide_fix">바이브 프롬프트: 빌드·테스트 오류 수정 (길게: /ide)</option>
        <option value="vibe_commit">바이브 프롬프트: 요약 &amp; Git 커밋 (길게: /hooks)</option>
        <option value="custom">직접 입력</option>
      </select>
    </div>
    <div class="field">
      <label>커스텀 라벨 (비워두면 기본 아이콘명)</label>
      <input type="text" id="label" placeholder="코드리뷰" />
    </div>
    <div class="field">
      <label>짧게 누를 때 전송할 텍스트</label>
      <textarea id="commandText"></textarea>
    </div>
    <div class="field">
      <label>길게 누를 때 전송할 텍스트</label>
      <input type="text" id="longPressCommand" />
    </div>
    <label class="check-row">
      <input type="checkbox" id="autoEnter" checked />
      전송 후 자동 Enter 실행
    </label>
  </div>

  <div class="section hidden" id="cfg-utility">
    <div class="section-title">바이브 유틸리티</div>
    <select id="utilType">
      <option value="voice">음성 바이브 입력 (Win+H / macOS 받아쓰기)</option>
      <option value="screenshot">스샷 첨부 (Ctrl+V / Cmd+V, 길게: 영역캡처)</option>
      <option value="launch">Codex 터미널 포커스 / 실행</option>
      <option value="install_hooks">~/.codex/config.toml &amp; hooks.json 자동 설정/복구</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">
      <span>실시간 상태 테스트 (LCD 즉시 반영)</span>
      <span id="hookBadge" class="badge">✓ Codex 감시중</span>
    </div>
    <div class="btn-grid">
      <button type="button" data-sim="IDLE">대기</button>
      <button type="button" data-sim="RUNNING">동작중</button>
      <button type="button" data-sim="WAITING_PERMISSION">승인대기</button>
      <button type="button" data-sim="WAITING_INPUT">입력대기</button>
      <button type="button" data-sim="COMPLETED">완료</button>
      <button type="button" id="btnDemo">▶ 데모</button>
    </div>
    <button type="button" class="primary" id="btnInstallHooks">~/.codex/config.toml &amp; hooks.json 자동 설정</button>
    <div class="hint" id="liveSummary">연결 대기 중...</div>
  </div>

  <script>
    let ws = null, piUUID = '', actionUUID = '', currentSettings = {};
    const PRESET_MAP = {
      review:      { commandText: '/review',  longPressCommand: '/diff',   autoEnter: true },
      compact:     { commandText: '/compact', longPressCommand: '/status', autoEnter: true },
      clear:       { commandText: '/new',     longPressCommand: '/init',   autoEnter: true },
      ide_fix:     { commandText: '빌드와 테스트를 실행하고 실패하거나 오류가 나는 부분을 찾아 수정해줘', longPressCommand: '/ide', autoEnter: true },
      vibe_commit: { commandText: 'git status와 diff를 확인해서 변경사항을 깔끔하게 요약하고 적절한 커밋 메시지로 커밋해줘', longPressCommand: '/hooks', autoEnter: true }
    };

    function showSection() {
      const map = {
        'com.vibecoding.codex.status': 'cfg-status',
        'com.vibecoding.codex.approval': 'cfg-approval',
        'com.vibecoding.codex.model': 'cfg-model',
        'com.vibecoding.codex.mode': 'cfg-mode',
        'com.vibecoding.codex.command': 'cfg-command',
        'com.vibecoding.codex.utility': 'cfg-utility'
      };
      Object.values(map).forEach((id) => document.getElementById(id).classList.add('hidden'));
      if (map[actionUUID]) document.getElementById(map[actionUUID]).classList.remove('hidden');
    }

    function populate(s) {
      document.getElementById('displayStyle').value = s.displayStyle || 'icon_label';
      if (s.panelMode) document.getElementById('panelMode').value = s.panelMode;
      if (s.responseType) document.getElementById('responseType').value = s.responseType;
      if (s.modelMode) document.getElementById('modelMode').value = s.modelMode;
      if (s.targetModel) document.getElementById('targetModel').value = s.targetModel;
      document.getElementById('modelSendSlash').checked = s.sendSlashCommand !== false;
      document.getElementById('targetModelWrap').style.display =
        document.getElementById('modelMode').value === 'fixed' ? 'block' : 'none';
      if (s.settingType) document.getElementById('settingType').value = s.settingType;
      if (s.preset) document.getElementById('preset').value = s.preset;
      document.getElementById('label').value = s.label || '';
      document.getElementById('commandText').value = s.commandText || '';
      document.getElementById('longPressCommand').value = s.longPressCommand || '';
      document.getElementById('autoEnter').checked = s.autoEnter !== false;
      if (s.utilType) document.getElementById('utilType').value = s.utilType;
    }

    function save() {
      const next = { ...currentSettings, displayStyle: document.getElementById('displayStyle').value };
      if (actionUUID.endsWith('.status')) next.panelMode = document.getElementById('panelMode').value;
      else if (actionUUID.endsWith('.approval')) next.responseType = document.getElementById('responseType').value;
      else if (actionUUID.endsWith('.model')) {
        next.modelMode = document.getElementById('modelMode').value;
        next.targetModel = document.getElementById('targetModel').value;
        next.sendSlashCommand = document.getElementById('modelSendSlash').checked;
        document.getElementById('targetModelWrap').style.display = next.modelMode === 'fixed' ? 'block' : 'none';
      } else if (actionUUID.endsWith('.mode')) next.settingType = document.getElementById('settingType').value;
      else if (actionUUID.endsWith('.command')) {
        next.preset = document.getElementById('preset').value;
        next.label = document.getElementById('label').value;
        next.commandText = document.getElementById('commandText').value;
        next.longPressCommand = document.getElementById('longPressCommand').value;
        next.autoEnter = document.getElementById('autoEnter').checked;
      } else if (actionUUID.endsWith('.utility')) next.utilType = document.getElementById('utilType').value;
      currentSettings = next;
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'setSettings', context: piUUID, payload: next }));
    }

    function sendToPlugin(payload) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'sendToPlugin', action: actionUUID, context: piUUID, payload }));
    }

    document.getElementById('preset').addEventListener('change', (e) => {
      const p = PRESET_MAP[e.target.value];
      if (p) {
        document.getElementById('commandText').value = p.commandText;
        document.getElementById('longPressCommand').value = p.longPressCommand;
        document.getElementById('autoEnter').checked = p.autoEnter;
      }
      save();
    });
    document.querySelectorAll('select, input, textarea').forEach((el) => {
      if (el.id === 'preset') return;
      el.addEventListener('change', save);
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.addEventListener('input', save);
    });
    document.querySelectorAll('[data-sim]').forEach((b) => b.addEventListener('click', () => sendToPlugin({ cmd: 'simulate', state: b.getAttribute('data-sim') })));
    document.getElementById('btnDemo').addEventListener('click', () => sendToPlugin({ cmd: 'demo' }));
    document.getElementById('btnInstallHooks').addEventListener('click', () => sendToPlugin({ cmd: 'installHooks' }));

    window.connectElgatoStreamDeckSocket = function (inPort, inUUID, inRegEvent, inInfo, inActionInfo) {
      piUUID = inUUID;
      const act = JSON.parse(inActionInfo);
      actionUUID = act.action;
      currentSettings = (act.payload && act.payload.settings) || {};
      showSection();
      populate(currentSettings);
      ws = new WebSocket('ws://127.0.0.1:' + inPort);
      ws.onopen = () => {
        ws.send(JSON.stringify({ event: inRegEvent, uuid: inUUID }));
        sendToPlugin({ cmd: 'getState' });
      };
      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.event === 'sendToPropertyInspector' && msg.payload && msg.payload.state) {
            const st = msg.payload.state;
            document.getElementById('liveSummary').textContent =
              `상태: ${st.state} | 모델: ${st.modelDisplay} | 추론: ${st.effort.toUpperCase()} | 타일: ${st.connectedContexts}개`;
          }
        } catch (_) {}
      };
    };
    window.connectSocket = window.connectElgatoStreamDeckSocket;
  </script>
</body>
</html>
